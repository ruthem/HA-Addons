# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: OpenClaw Gateway
version: "0.1.0"
slug: openclaw-gateway
description: OpenClaw AI Gateway — verbinde deine KI mit Home Assistant
url: "https://github.com/ruthem/HA-Addons/tree/main/openclaw-gateway"
arch:
  - aarch64
  - amd64
init: false
host_network: true
hassio_api: true
homeassistant_api: true
map:
  - config:rw
  - share:rw
ports:
  18789/tcp: 18789
ports_description:
  18789/tcp: OpenClaw Gateway WebSocket
options:
  workspace_path: "/config/openclaw"
  verbose: false
schema:
  workspace_path: "str"
  verbose: "bool"